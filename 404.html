<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <title>BudgetKing</title>
  <!--
    GitHub Pages serves this file for any unknown path (deep links to Angular
    routes). It re-encodes the path into a query string and redirects to the
    app root, where the script in index.html decodes it back before Angular
    boots. See https://github.com/rafgraph/spa-github-pages
  -->
  <script type="text/javascript">
    var pathSegmentsToKeep = 1; // keep the "/BugdetKingg" repo segment

    var l = window.location;
    l.replace(
      l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
      l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
      l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
      (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
      l.hash
    );
  </script>
</head>

<body></body>

</html>
