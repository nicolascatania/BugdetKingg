spring.application.name=BudgetKing

server.port=${PORT:8080}
# Behind a reverse proxy (Render) the real client IP arrives in X-Forwarded-For; needed for per-IP rate limiting.
server.forward-headers-strategy=framework

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3307/budget_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:user_budget}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:user_password}

spring.jpa.hibernate.ddl-auto=update
# SQL logging is opt-in: statements carry user data (amounts, descriptions) and must not land in production logs.
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost,http://localhost:4200}
# No default on purpose: the app must refuse to start without an explicit signing key (base64, >= 256 bits).
app.jwt.secret=${JWT_SECRET}

# Rate limit for /auth/** (login, register): requests allowed per client IP within the refill window.
app.auth.rate-limit.capacity=${AUTH_RATE_LIMIT_CAPACITY:10}
app.auth.rate-limit.refill-minutes=${AUTH_RATE_LIMIT_REFILL_MINUTES:1}
