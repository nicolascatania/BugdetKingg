<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <title>BudgetKing</title>
  <base href="/" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <!-- The ?v= query busts the long-lived favicon cache browsers and GitHub
       Pages keep; bump it whenever the brand mark changes. -->
  <link rel="icon" type="image/svg+xml" href="favicon.svg?v=2" />
  <link rel="alternate icon" type="image/x-icon" href="favicon.ico?v=2" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Sora:wght@500;600;700;800&display=swap"
    rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">

  <!-- Decodes the redirect that 404.html builds for deep links on GitHub
       Pages, restoring the real path before Angular's router boots.
       See https://github.com/rafgraph/spa-github-pages -->
  <script type="text/javascript">
    (function (l) {
      if (l.search[1] === '/') {
        var decoded = l.search.slice(1).split('&').map(function (s) {
          return s.replace(/~and~/g, '&');
        }).join('?');
        window.history.replaceState(null, null,
          l.pathname.slice(0, -1) + decoded + l.hash
        );
      }
    }(window.location));
  </script>

  <!-- Applies the stored (or system) theme before the first paint so the app
       never flashes the wrong background while Angular boots. -->
  <script>
    (function () {
      try {
        var stored = localStorage.getItem('budgetking-theme');
        var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        var isDark = stored ? stored === 'dark' : prefersDark;
        document.documentElement.classList.toggle('dark', isDark);
        document.documentElement.style.colorScheme = isDark ? 'dark' : 'light';
      } catch (e) {
        /* Private browsing can block localStorage; the light theme is a safe default. */
      }
    })();
  </script>
</head>

<body>
  <app-root></app-root>
</body>

</html>
