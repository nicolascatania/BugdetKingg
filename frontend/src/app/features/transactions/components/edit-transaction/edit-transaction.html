<ng-container *transloco="let t">
<ui-modal
  [open]="true"
  maxWidth="max-w-2xl"
  [title]="transaction ? t('transactions.form.editTitle') : t('transactions.form.createTitle')"
  (closed)="close(false)"
>
  <div modal-body>
    <form [formGroup]="form" class="space-y-5">
      <!-- Type selector: a segmented control, the type drives the rest of the form -->
      <div
        class="grid grid-cols-3 gap-1.5 rounded-2xl border border-line bg-surface-2 p-1.5"
        role="radiogroup"
        [attr.aria-label]="t('fields.type')"
        [title]="transaction ? t('transactions.form.typeLocked') : null"
      >
        <button
          type="button"
          (click)="setType('EXPENSE')"
          role="radio"
          [attr.aria-checked]="form.get('type')?.value === 'EXPENSE'"
          [disabled]="!!transaction"
          class="rounded-xl px-3 py-2.5 text-sm transition-all duration-200 ease-smooth disabled:cursor-not-allowed disabled:opacity-50"
          [ngClass]="
            form.get('type')?.value === 'EXPENSE'
              ? 'bg-negative/12 font-semibold text-negative shadow-soft'
              : 'text-muted hover:bg-surface-3 hover:text-body'
          "
        >
          {{ t('transactionType.EXPENSE') }}
        </button>

        <button
          type="button"
          (click)="setType('INCOME')"
          role="radio"
          [attr.aria-checked]="form.get('type')?.value === 'INCOME'"
          [disabled]="!!transaction"
          class="rounded-xl px-3 py-2.5 text-sm transition-all duration-200 ease-smooth disabled:cursor-not-allowed disabled:opacity-50"
          [ngClass]="
            form.get('type')?.value === 'INCOME'
              ? 'bg-positive/12 font-semibold text-positive shadow-soft'
              : 'text-muted hover:bg-surface-3 hover:text-body'
          "
        >
          {{ t('transactionType.INCOME') }}
        </button>

        <button
          type="button"
          (click)="setType('TRANSFER')"
          role="radio"
          [attr.aria-checked]="form.get('type')?.value === 'TRANSFER'"
          [disabled]="!!transaction"
          class="rounded-xl px-3 py-2.5 text-sm transition-all duration-200 ease-smooth disabled:cursor-not-allowed disabled:opacity-50"
          [ngClass]="
            form.get('type')?.value === 'TRANSFER'
              ? 'bg-accent/12 font-semibold text-accent shadow-soft'
              : 'text-muted hover:bg-surface-3 hover:text-body'
          "
        >
          {{ t('transactionType.TRANSFER') }}
        </button>
      </div>

      <div class="grid grid-cols-1 gap-4 sm:grid-cols-2">
        <!-- Amount + quick add buttons -->
        <div>
          <label for="tx-amount" class="field-label">{{ t('fields.amount') }}</label>
          <div
            class="flex items-center gap-2 rounded-xl border border-line bg-surface-2 pr-2 transition-all duration-200
                   focus-within:border-brand focus-within:bg-surface focus-within:ring-4 focus-within:ring-brand/15"
          >
            <span class="pl-3.5 text-sm font-semibold text-muted">$</span>
            <input
              id="tx-amount"
              type="number"
              formControlName="amount"
              placeholder="0.00"
              class="tabular w-full min-w-0 bg-transparent py-2.5 text-sm font-bold text-body outline-none placeholder:text-subtle"
            />

            <div class="flex shrink-0 gap-1">
              @for (quick of [1000, 5000, 10000]; track quick) {
                <button
                  type="button"
                  (click)="setQuickAmount(quick)"
                  class="rounded-lg border border-line bg-surface px-2 py-1 text-[10px] font-bold text-muted
                         transition-all duration-200 hover:border-brand/40 hover:text-brand active:scale-95"
                >
                  +{{ quick / 1000 }}K
                </button>
              }
            </div>
          </div>
        </div>

        <div>
          <label for="tx-origin" class="field-label">{{ t('transactions.form.originAccount') }}</label>
          <select
            id="tx-origin"
            formControlName="account"
            class="field-select"
            [title]="transaction ? t('transactions.form.accountLocked') : null"
          >
            @for (account of accounts(); track account.id) {
              <option [value]="account.id">{{ getAccountLabel(account) }}</option>
            }
          </select>
        </div>
      </div>

      <div class="grid grid-cols-1 gap-4 sm:grid-cols-2">
        @if (form.get('type')?.value === 'TRANSFER') {
          <div class="animate-fade-in">
            <label for="tx-destination" class="field-label">{{ t('transactions.form.destinationAccount') }}</label>
            <select
              id="tx-destination"
              formControlName="destinationAccount"
              class="field-select"
              [title]="transaction ? t('transactions.form.destinationLocked') : null"
            >
              @for (account of filteredDestinationAccounts(); track account.id) {
                <option [value]="account.id">{{ getAccountLabel(account) }}</option>
              }
            </select>
          </div>
        } @else {
          <div class="animate-fade-in">
            <label for="tx-category" class="field-label">{{ t('fields.category') }}</label>
            <select id="tx-category" formControlName="category" class="field-select">
              <option value="">{{ t('transactions.form.selectCategory') }}</option>
              @for (category of categories; track category.id) {
                <option [value]="category.id">{{ category.value }}</option>
              }
            </select>
          </div>
        }

        <div>
          <label for="tx-date" class="field-label">{{ t('fields.date') }}</label>
          <input id="tx-date" type="datetime-local" formControlName="date" class="field-input" />
        </div>
      </div>

      <div class="grid grid-cols-1 gap-4 sm:grid-cols-2">
        <div>
          <label for="tx-counterparty-field" class="field-label">{{ t('fields.counterparty') }}</label>
          <input
            id="tx-counterparty-field"
            type="text"
            formControlName="counterparty"
            [placeholder]="t('transactions.form.counterpartyPlaceholder')"
            class="field-input"
          />
        </div>

        <div>
          <label for="tx-description-field" class="field-label">{{ t('fields.description') }}</label>
          <input
            id="tx-description-field"
            type="text"
            formControlName="description"
            [placeholder]="t('transactions.form.descriptionPlaceholder')"
            class="field-input"
          />
        </div>
      </div>
    </form>
  </div>

  <div modal-footer class="flex w-full justify-end gap-3">
    <button type="button" class="btn-secondary" (click)="close(false)">{{ t('common.cancel') }}</button>

    <button
      type="button"
      class="btn-primary min-w-[7rem]"
      (click)="submit()"
      [disabled]="form.invalid || saving()"
      [title]="form.invalid ? t('transactions.form.completeFields') : null"
    >
      @if (saving()) {
        <i class="fa-solid fa-circle-notch fa-spin text-xs"></i>
        <span>{{ t('common.saving') }}</span>
      } @else {
        <span>{{ transaction ? t('common.update') : t('common.create') }}</span>
      }
    </button>
  </div>
</ui-modal>
</ng-container>
