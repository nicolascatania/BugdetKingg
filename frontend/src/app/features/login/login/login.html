<div class="w-full max-w-md">
  <!-- Brand -->
  <div class="mb-8 flex flex-col items-center text-center">
    <div class="relative">
      <span
        class="relative z-10 flex h-16 w-16 items-center justify-center rounded-2xl
               bg-gradient-to-br from-brand to-accent text-brand-contrast shadow-glow"
      >
        <i class="fa-solid fa-crown text-2xl"></i>
      </span>
      <!-- Slow halo that keeps the mark feeling alive. -->
      <span
        class="absolute inset-0 rounded-2xl bg-brand/40 animate-pulse-ring"
        aria-hidden="true"
      ></span>
    </div>

    <h1 class="mt-6 font-display text-3xl font-extrabold tracking-tight">
      Budget<span class="text-gradient-brand">King</span>
    </h1>
    <p class="mt-2 text-sm text-muted">Welcome back. Your money is waiting.</p>
  </div>

  <!-- Card -->
  <div class="auth-card card-sheen rounded-3xl border border-line bg-surface/80 p-6 shadow-lifted backdrop-blur-2xl sm:p-8">
    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="space-y-5" novalidate>
      <div>
        <label for="login-email" class="field-label">Email address</label>
        <div class="relative">
          <i
            class="fa-solid fa-envelope pointer-events-none absolute left-3.5 top-1/2 -translate-y-1/2 text-xs text-subtle"
          ></i>
          <input
            id="login-email"
            formControlName="email"
            type="email"
            autocomplete="email"
            placeholder="you@example.com"
            class="field-input pl-10"
            [class.border-negative]="showError('email')"
          />
        </div>
        @if (showError('email')) {
          <p class="mt-1.5 animate-fade-in text-xs font-medium text-negative">
            <i class="fa-solid fa-circle-exclamation mr-1"></i>
            Enter a valid email address.
          </p>
        }
      </div>

      <div>
        <label for="login-password" class="field-label">Password</label>
        <div class="relative">
          <i
            class="fa-solid fa-lock pointer-events-none absolute left-3.5 top-1/2 -translate-y-1/2 text-xs text-subtle"
          ></i>
          <input
            id="login-password"
            formControlName="password"
            [type]="passwordVisible() ? 'text' : 'password'"
            autocomplete="current-password"
            placeholder="••••••••"
            class="field-input px-10"
            [class.border-negative]="showError('password')"
          />
          <button
            type="button"
            (click)="togglePasswordVisibility()"
            class="absolute right-1 top-1/2 flex h-9 w-9 -translate-y-1/2 items-center justify-center
                   rounded-lg text-subtle transition-colors hover:text-brand"
            [attr.aria-label]="passwordVisible() ? 'Hide password' : 'Show password'"
          >
            <i class="fa-solid text-xs" [class.fa-eye]="!passwordVisible()" [class.fa-eye-slash]="passwordVisible()"></i>
          </button>
        </div>
        @if (showError('password')) {
          <p class="mt-1.5 animate-fade-in text-xs font-medium text-negative">
            <i class="fa-solid fa-circle-exclamation mr-1"></i>
            Password is required.
          </p>
        }
      </div>

      <button type="submit" class="btn-primary w-full" [disabled]="submitting()">
        @if (submitting()) {
          <i class="fa-solid fa-circle-notch fa-spin text-xs"></i>
          <span>Signing in…</span>
        } @else {
          <span>Sign in</span>
          <i class="fa-solid fa-arrow-right text-xs transition-transform duration-300 group-hover:translate-x-1"></i>
        }
      </button>
    </form>

    <div class="my-6 flex items-center gap-3">
      <span class="h-px flex-1 bg-line"></span>
      <span class="text-[11px] font-semibold uppercase tracking-widest text-subtle">New here</span>
      <span class="h-px flex-1 bg-line"></span>
    </div>

    <a routerLink="/register" class="btn-secondary w-full">
      Create an account
    </a>
  </div>

  <p class="mt-6 text-center text-xs text-subtle">
    Track accounts, categories and every move — in one place.
  </p>
</div>
