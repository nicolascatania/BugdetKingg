<ng-container *transloco="let t">
<ui-modal [open]="true" [title]="category() ? t('categories.form.editTitle') : t('categories.form.createTitle')" (closed)="close()">
  <div modal-body>
    <form [formGroup]="form" class="space-y-5">
      <div>
        <label for="category-name" class="field-label">{{ t('categories.form.name') }}</label>
        <input
          id="category-name"
          type="text"
          formControlName="name"
          [placeholder]="t('categories.form.namePlaceholder')"
          class="field-input"
        />
      </div>

      <div>
        <span class="field-label">{{ t('categories.form.icon') }}</span>

        <div class="relative">
          <i
            class="fa-solid fa-magnifying-glass pointer-events-none absolute left-3.5 top-1/2 -translate-y-1/2 text-xs text-subtle"
          ></i>
          <input
            type="text"
            [placeholder]="t('categories.form.searchIconPlaceholder')"
            (input)="searchQuery.set($any($event.target).value)"
            class="field-input pl-10"
            [attr.aria-label]="t('categories.form.searchIcons')"
          />
        </div>

        <div
          class="custom-scroll mt-2.5 grid max-h-64 grid-cols-5 gap-2 overflow-y-auto rounded-2xl
                 border border-line bg-surface-2 p-2.5 sm:grid-cols-7"
        >
          @for (option of filteredIcons(); track option.value) {
            <button
              type="button"
              (click)="form.patchValue({ icon: option.value })"
              [title]="t(option.labelKey)"
              [attr.aria-label]="t(option.labelKey)"
              [attr.aria-pressed]="form.get('categories.form.icon')?.value === option.value"
              class="flex aspect-square items-center justify-center rounded-xl border text-sm
                     transition-all duration-200 ease-spring hover:-translate-y-0.5"
              [ngClass]="
                form.get('categories.form.icon')?.value === option.value
                  ? 'border-brand bg-brand/12 text-brand shadow-soft'
                  : 'border-line bg-surface text-muted hover:border-line-strong hover:text-body'
              "
            >
              <i class="fa-solid" [ngClass]="option.preview"></i>
            </button>
          } @empty {
            <p class="col-span-full py-6 text-center text-xs text-subtle">{{ t('categories.form.noIcons') }}</p>
          }
        </div>
      </div>
    </form>
  </div>

  <div modal-footer class="flex w-full justify-end gap-3">
    <button type="button" class="btn-secondary" (click)="close()">{{ t('common.cancel') }}</button>
    <button type="button" class="btn-primary min-w-[6rem]" (click)="submit()" [disabled]="form.invalid || saving()">
      @if (saving()) {
        <i class="fa-solid fa-circle-notch fa-spin text-xs"></i>
        <span>{{ t('common.saving') }}</span>
      } @else {
        <span>{{ category() ? t('categories.form.update') : t('categories.form.create') }}</span>
      }
    </button>
  </div>
</ui-modal>
</ng-container>
