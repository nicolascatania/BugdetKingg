<div class="mx-auto w-full max-w-screen-2xl space-y-8">
  <div appReveal>
    <heading (newAccount)="openNewAccountModal()" (newTransaction)="openNewTransactionModal()"></heading>
  </div>

  <div appReveal [revealDelay]="60">
    <accounts></accounts>
  </div>

  <div appReveal [revealDelay]="120">
    <monthly-summary></monthly-summary>
  </div>

  <section appReveal [revealDelay]="180">
    <div class="mb-4 flex items-center justify-between gap-4">
      <h2 class="section-title">Recent activity</h2>
      <span class="chip-brand">This month</span>
    </div>
    <last-moves></last-moves>
  </section>
</div>

@if (isAccountModalOpen) {
  <app-edit-account-modal [account]="selectedAccount" (closed)="onModalClosed($event)"></app-edit-account-modal>
}

@if (isTransactionModalOpen) {
  <app-edit-transaction
    [transaction]="selectedTransaction"
    [accounts]="accounts()"
    (closed)="onTransactionModalClosed($event)"
  />
}
