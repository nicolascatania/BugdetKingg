<div class="card space-y-4 p-5" *transloco="let t">
  <div class="flex flex-col gap-3 sm:flex-row sm:items-center sm:justify-between">
    <div>
      <h3 class="section-title">{{ t('dashboard.chart.title') }}</h3>
      <p class="mt-0.5 text-xs text-muted">{{ t('dashboard.chart.subtitle') }}</p>
    </div>

    <label class="sr-only" for="chart-account">{{ t('dashboard.chart.filterByAccount') }}</label>
    <select
      id="chart-account"
      class="field-select w-full py-2 text-xs sm:w-52"
      (change)="onAccountChange($any($event.target).value)"
    >
      <option value="">{{ t('dashboard.chart.allAccounts') }}</option>
      @for (account of accounts(); track account.id) {
        <option [value]="account.id">{{ account.value }}</option>
      }
    </select>
  </div>

  <div class="h-72 w-full sm:h-80">
    <canvas id="incomeExpenseChart"></canvas>
  </div>
</div>
