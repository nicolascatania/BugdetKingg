<div class="card space-y-4 p-5">
  <div class="flex flex-col gap-3 sm:flex-row sm:items-center sm:justify-between">
    <div>
      <h3 class="section-title">Income vs expense</h3>
      <p class="mt-0.5 text-xs text-muted">Current year, month by month</p>
    </div>

    <label class="sr-only" for="chart-account">Filter by account</label>
    <select
      id="chart-account"
      class="field-select w-full py-2 text-xs sm:w-52"
      (change)="onAccountChange($any($event.target).value)"
    >
      <option value="">All accounts</option>
      @for (account of accounts(); track account.id) {
        <option [value]="account.id">{{ account.value }}</option>
      }
    </select>
  </div>

  <div class="h-72 w-full sm:h-80">
    <canvas id="incomeExpenseChart"></canvas>
  </div>
</div>
