<ng-container *transloco="let t">
<ui-modal [open]="true" [title]="isEdit() ? t('savings.form.editTitle') : t('savings.form.createTitle')" (closed)="close()">
  <div modal-body>
    <form [formGroup]="form" class="space-y-5">
      <div>
        <label for="goal-name" class="field-label">{{ t('fields.name') }}</label>
        <input
          id="goal-name"
          type="text"
          formControlName="name"
          [placeholder]="t('savings.form.namePlaceholder')"
          class="field-input"
        />
      </div>

      <div class="grid grid-cols-1 gap-4 sm:grid-cols-2">
        <div>
          <label for="goal-target-amount" class="field-label">{{ t('savings.form.targetAmount') }}</label>
          <div
            class="flex items-center gap-2 rounded-xl border border-line bg-surface-2 pr-2 transition-all duration-200
                   focus-within:border-brand focus-within:bg-surface focus-within:ring-4 focus-within:ring-brand/15"
          >
            <span class="pl-3.5 text-sm font-semibold text-muted">$</span>
            <input
              id="goal-target-amount"
              type="number"
              formControlName="targetAmount"
              placeholder="0.00"
              class="tabular w-full min-w-0 bg-transparent py-2.5 text-sm font-bold text-body outline-none placeholder:text-subtle"
            />
          </div>
        </div>

        <div>
          <label for="goal-target-date" class="field-label">{{ t('savings.targetDate') }}</label>
          <input id="goal-target-date" type="date" formControlName="targetDate" class="field-input" />
        </div>
      </div>

      <div>
        <label for="goal-linked-account" class="field-label">{{ t('savings.form.linkedAccount') }}</label>
        <select id="goal-linked-account" formControlName="linkedAccountId" class="field-select">
          <option value="">{{ t('common.none') }}</option>
          @for (account of accounts(); track account.id) {
            <option [value]="account.id">{{ account.value }}</option>
          }
        </select>
        <p class="field-hint">{{ t('savings.form.linkedAccountHint') }}</p>
      </div>

      <div>
        <span class="field-label">{{ t('fields.icon') }}</span>
        <div class="grid grid-cols-5 gap-2 rounded-2xl border border-line bg-surface-2 p-2.5 sm:grid-cols-8">
          @for (option of iconOptions; track option.value) {
            <button
              type="button"
              (click)="form.patchValue({ icon: option.value })"
              [title]="t(option.labelKey)"
              [attr.aria-label]="t(option.labelKey)"
              [attr.aria-pressed]="form.get('icon')?.value === option.value"
              class="flex aspect-square items-center justify-center rounded-xl border text-sm
                     transition-all duration-200 ease-spring hover:-translate-y-0.5"
              [ngClass]="
                form.get('icon')?.value === option.value
                  ? 'border-brand bg-brand/12 text-brand shadow-soft'
                  : 'border-line bg-surface text-muted hover:border-line-strong hover:text-body'
              "
            >
              <i class="fa-solid" [ngClass]="option.preview"></i>
            </button>
          }
        </div>
      </div>
    </form>
  </div>

  <div modal-footer class="flex w-full justify-end gap-3">
    <button type="button" class="btn-secondary" (click)="close()">{{ t('common.cancel') }}</button>
    <button type="button" class="btn-primary min-w-[7rem]" (click)="submit()" [disabled]="form.invalid || saving()">
      @if (saving()) {
        <i class="fa-solid fa-circle-notch fa-spin text-xs"></i>
        <span>{{ t('common.saving') }}</span>
      } @else {
        <span>{{ isEdit() ? t('common.update') : t('common.create') }}</span>
      }
    </button>
  </div>
</ui-modal>
</ng-container>
