@if (open) {
  <div
    class="fixed inset-0 z-50 flex items-end justify-center sm:items-center"
    role="dialog"
    aria-modal="true"
    [attr.aria-label]="title"
  >
    <!-- Backdrop -->
    <div
      class="modal-backdrop absolute inset-0 bg-black/50 backdrop-blur-sm"
      (click)="close()"
    ></div>

    <!-- Panel: bottom sheet on phones, centred dialog from `sm` up -->
    <div
      class="modal-panel relative flex max-h-[92vh] w-full flex-col overflow-hidden
             rounded-t-3xl border border-line bg-surface shadow-lifted
             sm:rounded-3xl {{ maxWidth }}"
    >
      <!-- Grab handle, mobile affordance for the sheet -->
      <div class="mx-auto mt-2.5 h-1 w-10 shrink-0 rounded-full bg-line-strong sm:hidden"></div>

      <!-- Header -->
      <div class="flex shrink-0 items-center justify-between gap-4 px-5 py-4 sm:px-6">
        <h2 class="font-display text-lg font-bold tracking-tight text-body">
          {{ title }}
        </h2>

        <button
          type="button"
          class="flex h-9 w-9 items-center justify-center rounded-lg text-muted
                 transition-all duration-200 hover:rotate-90 hover:bg-surface-2 hover:text-negative"
          (click)="close()"
          aria-label="Close dialog"
        >
          <i class="fa-solid fa-xmark text-sm"></i>
        </button>
      </div>

      <div class="h-px shrink-0 bg-line"></div>

      <!-- Body -->
      <div class="custom-scroll flex-1 overflow-y-auto px-5 py-5 sm:px-6">
        <ng-content select="[modal-body]"></ng-content>
      </div>

      <!-- Footer -->
      <div
        class="flex shrink-0 items-center justify-end gap-3 border-t border-line bg-surface-2/50 px-5 py-4 sm:px-6"
      >
        <ng-content select="[modal-footer]"></ng-content>
      </div>
    </div>
  </div>
}
