<div class="flex items-center gap-1.5">
  <button
    type="button"
    [matMenuTriggerFor]="monthMenu"
    class="group inline-flex h-[42px] items-center gap-2 rounded-xl border border-line bg-surface-2 px-3.5
           text-xs font-semibold text-muted transition-all duration-200 ease-smooth
           hover:border-brand/40 hover:text-brand active:scale-[0.97]"
    aria-label="Quick-select a month"
  >
    <i
      class="fa-solid fa-calendar-days text-[11px] transition-transform duration-300 ease-spring group-hover:scale-110"
    ></i>
    Month
  </button>

  <i
    class="fa-solid fa-circle-info cursor-help text-xs text-subtle transition-colors hover:text-brand"
    [matTooltip]="'Selects the full month range for ' + currentYear"
    tabindex="0"
    role="note"
  ></i>
</div>

<mat-menu #monthMenu="matMenu">
  <div class="grid grid-cols-3 gap-1 p-1.5">
    @for (month of months; track month; let i = $index) {
      <button
        mat-menu-item
        type="button"
        class="!min-w-0 !px-3 !text-center !text-xs !font-semibold"
        (click)="selectMonth(i)"
      >
        {{ month }}
      </button>
    }
  </div>
</mat-menu>
