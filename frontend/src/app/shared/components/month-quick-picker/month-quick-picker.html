<div class="flex items-center gap-1.5">
  <button type="button" [matMenuTriggerFor]="monthMenu"
    class="h-11 flex items-center gap-1.5 rounded-lg bg-slate-950/40 border border-slate-800/80 px-3 text-xs font-semibold text-slate-300 hover:bg-slate-800/60 transition-colors"
    title="Quick-select a month">
    <i class="fa-solid fa-calendar-days text-[11px]"></i>
    Month
  </button>

  <i class="fa-solid fa-circle-info text-slate-500 hover:text-slate-300 cursor-help text-xs"
    [matTooltip]="'Selects the full month range for ' + currentYear"></i>
</div>

<mat-menu #monthMenu="matMenu">
  <div class="grid grid-cols-3 gap-1 p-1">
    @for (month of months; track month; let i = $index) {
    <button mat-menu-item type="button" class="!min-w-0 !px-3 !text-center" (click)="selectMonth(i)">
      {{ month }}
    </button>
    }
  </div>
</mat-menu>
