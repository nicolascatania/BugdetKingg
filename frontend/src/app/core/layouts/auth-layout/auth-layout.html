<div class="relative min-h-screen w-full overflow-hidden bg-app text-body">
  <!--
    Animated backdrop shared by every auth screen: two drifting brand washes,
    a faint grid and a slow conic sweep. Purely decorative, so it is hidden
    from assistive technology and never intercepts pointer events.
  -->
  <div class="pointer-events-none absolute inset-0 z-0 overflow-hidden" aria-hidden="true">
    <div class="auth-grid absolute inset-0"></div>

    <div
      class="wash absolute -left-32 -top-32 h-[30rem] w-[30rem] rounded-full bg-brand/25 animate-aurora-pan"
    ></div>
    <div
      class="wash absolute -bottom-40 -right-24 h-[34rem] w-[34rem] rounded-full bg-accent/20 animate-aurora-pan"
      style="animation-delay: -11s"
    ></div>
    <div
      class="wash absolute left-1/2 top-1/3 h-72 w-72 -translate-x-1/2 rounded-full bg-brand/10 animate-float"
      style="animation-delay: -6s"
    ></div>

    <!-- Drifting finance glyphs -->
    <i class="auth-glyph fa-solid fa-chart-line left-[8%] top-[16%] text-6xl sm:text-7xl"></i>
    <i
      class="auth-glyph fa-solid fa-wallet right-[10%] top-[58%] text-7xl sm:text-8xl"
      style="animation-delay: -3s"
    ></i>
    <i
      class="auth-glyph fa-solid fa-piggy-bank bottom-[10%] right-[6%] text-7xl sm:text-8xl"
      style="animation-delay: -7s"
    ></i>
    <i
      class="auth-glyph fa-solid fa-tags bottom-[18%] left-[14%] text-5xl sm:text-6xl"
      style="animation-delay: -5s"
    ></i>
    <i
      class="auth-glyph fa-solid fa-credit-card right-[22%] top-[14%] hidden text-6xl sm:block"
      style="animation-delay: -9s"
    ></i>
    <i
      class="auth-glyph fa-solid fa-coins left-[26%] top-[46%] hidden text-5xl lg:block"
      style="animation-delay: -2s"
    ></i>
  </div>

  <!-- Theme switch stays reachable before sign-in. -->
  <div class="absolute right-4 top-4 z-20 sm:right-6 sm:top-6">
    <app-theme-toggle />
  </div>

  <main class="relative z-10 flex min-h-screen items-center justify-center px-4 py-10 sm:px-6">
    <router-outlet></router-outlet>
  </main>
</div>
