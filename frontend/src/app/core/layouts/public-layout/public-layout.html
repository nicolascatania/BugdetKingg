<div class="relative flex min-h-screen flex-col bg-app text-body">
  <!-- Ambient wash, same idea as the app shell: a soft brand glow behind everything. -->
  <div class="pointer-events-none fixed inset-0 z-0 overflow-hidden" aria-hidden="true">
    <div
      class="wash absolute -left-40 -top-40 h-[30rem] w-[30rem] rounded-full bg-brand/15 animate-aurora-pan"
    ></div>
    <div
      class="wash absolute -right-32 top-1/3 h-[32rem] w-[32rem] rounded-full bg-accent/10 animate-aurora-pan"
      style="animation-delay: -9s"
    ></div>
  </div>

  <header
    class="sticky top-0 z-30 border-b border-line bg-surface/75 backdrop-blur-xl"
  >
    <div class="mx-auto flex h-16 w-full max-w-6xl items-center justify-between gap-4 px-4 sm:px-6 lg:px-8">
      <a routerLink="/" class="group flex items-center gap-3" aria-label="BudgetKing home">
        <span
          class="flex h-9 w-9 shrink-0 items-center justify-center rounded-xl
                 bg-gradient-to-br from-brand to-accent text-brand-contrast shadow-soft
                 transition-transform duration-300 ease-spring group-hover:scale-105"
        >
          <i class="fa-solid fa-crown text-sm" aria-hidden="true"></i>
        </span>
        <span class="font-display text-base font-bold tracking-tight">
          Budget<span class="text-brand">King</span>
        </span>
      </a>

      <nav class="flex items-center gap-2" aria-label="Primary">
        <a routerLink="/" fragment="features" class="btn-ghost hidden sm:inline-flex">Features</a>
        <a routerLink="/terms" class="btn-ghost hidden sm:inline-flex">Terms</a>
        <app-theme-toggle />
        <a [routerLink]="ctaRoute" class="btn-primary">
          {{ ctaLabel }}
          <i class="fa-solid fa-arrow-right text-xs" aria-hidden="true"></i>
        </a>
      </nav>
    </div>
  </header>

  <main class="relative z-10 flex-1">
    <router-outlet></router-outlet>
  </main>

  <app-site-footer />
</div>
